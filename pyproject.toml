[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytoolbox"
version = "0.1.0"
description = "A plugin-based command-line toolbox for learning open source workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pytoolbox = "pytoolbox.cli:app"

[tool.setuptools.packages.find]
include = ["pytoolbox*"]
